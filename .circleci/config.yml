version: 2.1
orbs:
  node: circleci/node@7.2.1
executors:
  node26:
    docker:
      - image: cimg/node:26.13
jobs:
  lint_test_build:
    executor:
      name: node26
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
            - v1-dependencies-
      - node/install-yarn
      - run: yarn install --immutable
      - save_cache:
          paths:
            - ./node_modules
          key: v1-dependencies-{{ checksum "yarn.lock" }}
      - run: yarn run lint
      - run: yarn run coverage
      - run: yarn run build
      - run: yarn pack
      - persist_to_workspace:
          root: /home/circleci/project
          paths:
            - ./assemblyvoting-js-client-*.tgz
  publish:
    executor:
      name: node26
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Move files
          command: |
            mv /tmp/workspace/assemblyvoting-js-client-*.tgz ./
      - run:
          # Trusted publishing (OIDC): npm exchanges this short-lived CircleCI
          # token for publish rights; no NPM_TOKEN involved. The job must keep
          # the npm-publishing context — the npm trusted-publisher config is
          # pinned to its context ID. Needs npm >= 11.5.1 (Node 26.13 ships 11.20).
          name: Publish to NPM (trusted publishing)
          command: |
            echo "npm $(npm --version)"
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            package_file=$(ls assemblyvoting-js-client-*.tgz)
            if echo "${package_file}" | grep -E "alpha|beta" > /dev/null; then
              prerelease=$(echo "${package_file}" | grep -E -o "alpha|beta")
              echo "Publishing prerelease with tag ${prerelease} to NPM"
              npm publish ${package_file} --tag ${prerelease}
            else
              echo "Publishing release with to NPM"
              npm publish ${package_file}
            fi
workflows:
  build_and_deploy:
    jobs:
      - lint_test_build:
          filters:
            branches:
              only: /.*/
            tags:
              only: /^v.*/
      - publish:
          context: ["npm-publishing"]
          requires:
            - lint_test_build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
